# fw-helper: allow the ChromeOS EC charge control driver to bind on Framework
# hardware.
#
# The driver refuses to load here by default because Framework's EC implements a
# custom charge control command alongside the standard one, and the custom one can
# override it. See docs/adr/0008-charge-limit-via-module-parameter.md.
#
# IMPORTANT: with this set, fw-helper is the charge-limit authority. Leave the
# battery limit in UEFI setup at its default, or the two will fight and fw-helper
# will report the conflict rather than silently losing.
#
# Takes effect after a reboot, or:
#   sudo modprobe -r cros_charge_control && sudo modprobe cros_charge_control
options cros_charge-control probe_with_fwk_charge_control=1
