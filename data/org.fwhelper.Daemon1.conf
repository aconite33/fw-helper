<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name; the daemon is the sole holder. -->
  <policy user="root">
    <allow own="org.fwhelper.Daemon1"/>
  </policy>

  <!--
    Anyone may read properties. Telemetry is deliberately readable by unprivileged
    clients so the GUI needs no privilege (ADR 0003); the exposure that creates is
    bounded by rate-limiting and quantization at the interface (ADR 0009).

    Note this grants send_destination broadly. From M2, methods that change hardware
    are gated by polkit inside the daemon rather than by this file, because D-Bus
    policy is too coarse to express per-action authorisation.

    Careful with comments here: XML forbids a double hyphen inside them, and
    dbus-daemon silently skips the whole file on a parse error, surfacing later as
    an AccessDenied when the daemon tries to own its name.
  -->
  <policy context="default">
    <allow send_destination="org.fwhelper.Daemon1"
           send_interface="org.fwhelper.Daemon1"/>
    <allow send_destination="org.fwhelper.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.fwhelper.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.fwhelper.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
