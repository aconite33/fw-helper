# cargo-deny — supply-chain checks for a root-privileged daemon (ADR 0010).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The workspace is GPL-3.0-only; these are what its dependency tree pulls in.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
